<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-labelledby="ti de"><title id="ti">0xCryp7icX: open to mentoring</title><desc id="de">A dawn harbour with a lighthouse and a rising sun on the horizon. Text: open to mentoring, walkthroughs of private work on request.</desc>
<defs>
<style>
.t{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.h{font-family:Georgia,'Palatino Linotype','Book Antiqua',serif}
.emb{paint-order:stroke;stroke:#060b1d;stroke-width:3;stroke-linejoin:round}
.drift{animation:drift 14s linear infinite}
.drift2{animation:drift 22s linear infinite reverse}
.tw{animation:tw 5s ease-in-out infinite}
.lamp{animation:lamp 4.5s ease-in-out infinite}
.bob{animation:bob 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.shim{animation:shim 8s ease-in-out infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-120px)}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes lamp{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes shim{0%{transform:translateX(-160px)}60%,100%{transform:translateX(360px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.tw{opacity:.5}.lamp{opacity:.85}.shim{opacity:0}}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1230"/><stop offset="1" stop-color="#1b2a5a"/></linearGradient>
<linearGradient id="plaque" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16224a"/><stop offset="1" stop-color="#0c1532"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7a8"/><stop offset=".55" stop-color="#f3c66b"/><stop offset="1" stop-color="#b8863a"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3c66b" stop-opacity="0"/><stop offset=".5" stop-color="#f3c66b"/><stop offset="1" stop-color="#f3c66b" stop-opacity="0"/></linearGradient>
<linearGradient id="shimg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe7a8" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#ffe7a8" stop-opacity="0"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#ffe7a8" stop-opacity=".9"/><stop offset=".4" stop-color="#f3c66b" stop-opacity=".35"/><stop offset="1" stop-color="#f3c66b" stop-opacity="0"/></radialGradient>
<filter id="ds" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#02040d" flood-opacity=".7"/></filter>
<clipPath id="frame"><rect width="1200" height="190" rx="18"/></clipPath>
<linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1230"/><stop offset=".45" stop-color="#2f3a80"/><stop offset=".78" stop-color="#b0668a"/><stop offset="1" stop-color="#ffb877"/></linearGradient>
<radialGradient id="sunrise" cx=".5" cy="1"><stop offset="0" stop-color="#fff3c8"/><stop offset=".25" stop-color="#ffe7a8" stop-opacity=".75"/><stop offset=".6" stop-color="#ffa96b" stop-opacity=".3"/><stop offset="1" stop-color="#ffa96b" stop-opacity="0"/></radialGradient>
<linearGradient id="seaglow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f7a"/><stop offset=".35" stop-color="#0f2247"/><stop offset="1" stop-color="#081431"/></linearGradient>
</defs>
<g clip-path="url(#frame)">
